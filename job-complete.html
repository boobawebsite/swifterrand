<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwiftErrand | Job Complete & Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Manrope',sans-serif;}
body{background:#f8fafc;color:#0f172a;min-height:100vh;display:flex;flex-direction:column;}
nav{height:75px;display:flex;justify-content:space-between;align-items:center;padding:0 8%;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.05);}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:22px;color:#0f172a;text-decoration:none;}
.logo-icon{width:40px;height:40px;background:#00A651;color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.container{max-width:650px;margin:40px auto 70px;padding:0 20px;width:100%;}
.card{background:#fff;border-radius:24px;padding:40px;box-shadow:0 10px 30px rgba(0,0,0,.05);border:1px solid #f1f5f9;text-align:center;}
.check-icon{width:80px;height:80px;border-radius:50%;background:#dcfce7;color:#16a34a;display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 20px;}
.stars{display:flex;justify-content:center;gap:10px;margin:25px 0;}
.star{font-size:36px;color:#e2e8f0;cursor:pointer;transition:.2s;}
.star.active{color:#eab308;}
textarea{width:100%;padding:16px;border:2px solid #e2e8f0;border-radius:14px;font-size:15px;outline:none;margin-bottom:20px;}
textarea:focus{border-color:#00A651;}
.btn-submit{width:100%;padding:16px;background:#00A651;color:#fff;border:none;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer;}
.btn-submit:hover{background:#007A3D;}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">
    <div class="logo-icon"><i class="fa-solid fa-bolt"></i></div>
    <span>SwiftErrand</span>
  </a>
  <a href="dashboard.html" style="text-decoration:none;font-weight:700;color:#00A651;">Skip to Dashboard</a>
</nav>

<div class="container">
  <div class="card">
    <div class="check-icon"><i class="fa-solid fa-check"></i></div>
    <h2 style="font-size:28px;margin-bottom:8px;">Job Completed Successfully!</h2>
    <p style="color:#64748b;font-size:15px;line-height:1.6;">
      Escrow funds of <strong>₦11,000</strong> have been safely released to <strong>Emeka Okon</strong> under SwiftShield™ protection.
    </p>

    <div style="border-top:1px solid #f1f5f9;margin:30px 0;padding-top:25px;">
      <h3 style="font-size:20px;margin-bottom:6px;">Rate Your Experience</h3>
      <p style="font-size:14px;color:#64748b;">Help other Uyo residents by rating Emeka's workmanship and punctuality.</p>

      <div class="stars" id="starContainer">
        <i class="fa-solid fa-star star active" onclick="setStar(1)"></i>
        <i class="fa-solid fa-star star active" onclick="setStar(2)"></i>
        <i class="fa-solid fa-star star active" onclick="setStar(3)"></i>
        <i class="fa-solid fa-star star active" onclick="setStar(4)"></i>
        <i class="fa-solid fa-star star active" onclick="setStar(5)"></i>
      </div>

      <textarea id="feedbackText" rows="3" placeholder="Tell us how Emeka did... (e.g. Arrived on time at Shelter Afrique, fixed the leak neatly and cleaned up afterwards.)">Arrived promptly at Shelter Afrique Gate 2. Fixed the plumbing leak neatly and tested the water pressure. Highly recommended!</textarea>

      <button type="button" class="btn-submit" onclick="submitReview()">
        <i class="fa-solid fa-award"></i> Submit Review & Earn ₦500 Credit
      </button>
    </div>
  </div>
</div>

<script src="toast.js"></script>
<script>
let rating = 5;

function setStar(n) {
  rating = n;
  const stars = document.querySelectorAll('.star');
  stars.forEach((s, i) => {
    s.classList.toggle('active', i < n);
  });
}

function submitReview() {
  showToast("Thank you! Your verified review has been published.", "success");
  setTimeout(() => {
    window.location.href = "dashboard.html";
  }, 1000);
}
</script>
</body>
</html>
