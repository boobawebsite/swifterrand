<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SwiftErrand</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Manrope,sans-serif;
}

body{

display:flex;
justify-content:center;
align-items:center;

height:100vh;

background:linear-gradient(135deg,#16a34a,#15803d);

overflow:hidden;

color:white;

}

.container{

text-align:center;

}

.logo{

width:130px;
height:130px;

border-radius:35px;

background:white;

margin:auto;

display:flex;
justify-content:center;
align-items:center;

font-size:65px;
font-weight:800;

color:#16a34a;

animation:pop 1s ease;

}

@keyframes pop{

0%{

transform:scale(.3) rotate(-20deg);
opacity:0;

}

100%{

transform:scale(1);
opacity:1;

}

}

h1{

margin-top:30px;

font-size:48px;

animation:fade 1.5s ease;

}

p{

margin-top:15px;

font-size:18px;

opacity:.9;

animation:fade 2s ease;

}

.loader{

margin:45px auto;

width:260px;
height:8px;

background:rgba(255,255,255,.2);

border-radius:50px;

overflow:hidden;

}

.fill{

height:100%;

width:0;

background:white;

animation:load 3s linear forwards;

}

@keyframes load{

to{

width:100%;

}

}

@keyframes fade{

from{

opacity:0;
transform:translateY(20px);

}

to{

opacity:1;
transform:translateY(0);

}

}

.version{

position:absolute;

bottom:30px;

font-size:14px;

opacity:.8;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

S

</div>

<h1>

SwiftErrand

</h1>

<p>

Trusted Help. Delivered.

</p>

<div class="loader">

<div class="fill"></div>

</div>

</div>

<div class="version">

Version 1.0 • SwiftErrand Official Platform

</div>

<script>

setTimeout(function(){

window.location="index.html";

},3000);

</script>

</body>
</html>
