<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Become a Provider | SwiftErrand</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Manrope,sans-serif;
}

body{
background:#f5f7fb;
}

.hero{

background:linear-gradient(135deg,#16a34a,#15803d);
padding:70px 20px;
text-align:center;
color:white;

}

.hero h1{

font-size:50px;
margin-bottom:15px;

}

.hero p{

font-size:20px;
opacity:.95;

}

.container{

max-width:1100px;
margin:40px auto;
padding:20px;

}

.form{

background:white;
padding:40px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.06);

}

.grid{

display:grid;
grid-template-columns:1fr 1fr;
gap:20px;

}

.input{

margin-bottom:20px;

}

label{

display:block;
margin-bottom:8px;
font-weight:700;

}

input,
select,
textarea{

width:100%;
padding:16px;
border:2px solid #ddd;
border-radius:14px;
outline:none;
font-size:16px;

}

textarea{

height:130px;
resize:none;

}

.upload{

border:2px dashed #16a34a;
padding:35px;
text-align:center;
border-radius:18px;
color:#16a34a;
margin-bottom:20px;

}

button{

width:100%;
padding:18px;
border:none;
background:#16a34a;
color:white;
font-size:18px;
font-weight:700;
border-radius:15px;
cursor:pointer;

}

.steps{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:35px;

}

.step{

background:#ecfdf5;
padding:20px;
text-align:center;
border-radius:15px;

}

.step i{

font-size:32px;
color:#16a34a;
margin-bottom:10px;

}

@media(max-width:768px){

.grid{

grid-template-columns:1fr;

}

.steps{

grid-template-columns:1fr 1fr;

}

}

</style>

</head>

<body>

<div class="hero">

<h1>

Become a SwiftErrand Provider

</h1>

<p>

Earn money by offering trusted services in your city.

</p>

</div>

<div class="container">

<div class="steps">

<div class="step">

<i class="fa-solid fa-user-check"></i>

<p>Register</p>

</div>

<div class="step">

<i class="fa-solid fa-id-card"></i>

<p>Verify Identity</p>

</div>

<div class="step">

<i class="fa-solid fa-clipboard-check"></i>

<p>Approval</p>

</div>

<div class="step">

<i class="fa-solid fa-wallet"></i>

<p>Start Earning</p>

</div>

</div>

<div class="form">

<div class="grid">

<div class="input">

<label>Full Name</label>

<input type="text">

</div>

<div class="input">

<label>Phone Number</label>

<input type="tel">

</div>

<div class="input">

<label>Email</label>

<input type="email">

</div>

<div class="input">

<label>Service Category</label>

<select>

<option>Cleaning</option>
<option>Electrician</option>
<option>Plumber</option>
<option>Dispatch Rider</option>
<option>Carpenter</option>
<option>Laundry</option>
<option>AC Technician</option>

</select>

</div>

<div class="input">

<label>Years of Experience</label>

<input type="number">

</div>

<div class="input">

<label>Preferred City</label>

<input type="text" placeholder="e.g. Uyo">

</div>

</div>

<div class="input">

<label>Tell us about yourself</label>

<textarea></textarea>

</div>

<div class="upload">

<i class="fa-solid fa-cloud-arrow-up fa-3x"></i>

<h3 style="margin-top:15px;">

Upload NIN / Driver's License

</h3>

<p>

Identity verification required

</p>

</div>

<div class="upload">

<i class="fa-solid fa-camera fa-3x"></i>

<h3 style="margin-top:15px;">

Upload Profile Photo

</h3>

</div>

<button onclick="submitApplication()">

Submit Application

</button>

</div>

</div>

<script>

function submitApplication(){

showToast("🎉 Application Submitted Successfully");

setTimeout(()=>{

window.location="provider-dashboard.html";

},1500);

}

</script>

<script src="toast.js"></script>

</body>
</html>
