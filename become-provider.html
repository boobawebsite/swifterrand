<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Become a Provider | SwiftErrand</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Manrope,sans-serif;
}

body{
background:#f5f7fb;
}

.hero{

background:linear-gradient(135deg,#16a34a,#15803d);
padding:70px 20px;
text-align:center;
color:white;

}

.hero h1{

font-size:50px;
margin-bottom:15px;

}

.hero p{

font-size:20px;
opacity:.95;

}

.container{

max-width:1100px;
margin:40px auto;
padding:20px;

}

.form{

background:white;
padding:40px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.06);

}

.grid{

display:grid;
grid-template-columns:1fr 1fr;
gap:20px;

}

.input{

margin-bottom:20px;

}

label{

display:block;
margin-bottom:8px;
font-weight:700;

}

input,
select,
textarea{

width:100%;
padding:16px;
border:2px solid #ddd;
border-radius:14px;
outline:none;
font-size:16px;

}

textarea{

height:130px;
resize:none;

}

.upload{

border:2px dashed #16a34a;
padding:35px;
text-align:center;
border-radius:18px;
color:#16a34a;
margin-bottom:20px;

}

button{

width:100%;
padding:18px;
border:none;
background:#16a34a;
color:white;
font-size:18px;
font-weight:700;
border-radius:15px;
cursor:pointer;

}

.steps{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:35px;

}

.step{

background:#ecfdf5;
padding:20px;
text-align:center;
border-radius:15px;

}

.step i{

font-size:32px;
color:#16a34a;
margin-bottom:10px;

}

@media(max-width:768px){
.grid{
grid-template-columns:1fr;
}
.steps{
grid-template-columns:1fr 1fr;
}
.hero h1{
font-size:36px;
}
}

@media(max-width:540px){
.hero{
padding:40px 16px;
}
.hero h1{
font-size:26px;
}
.hero p{
font-size:15px;
}
.form{
padding:22px 16px;
}
.steps{
grid-template-columns:1fr;
gap:12px;
}
.container{
padding:12px;
margin:20px auto;
}
}

</style>

</head>

<body>

<div class="hero">

<h1>

Become a SwiftErrand Provider

</h1>

<p>

Earn money by offering trusted services in your city.

</p>

</div>

<div class="container">

<div class="steps">

<div class="step">

<i class="fa-solid fa-user-check"></i>

<p>Register</p>

</div>

<div class="step">

<i class="fa-solid fa-id-card"></i>

<p>Verify Identity</p>

</div>

<div class="step">

<i class="fa-solid fa-clipboard-check"></i>

<p>Approval</p>

</div>

<div class="step">

<i class="fa-solid fa-wallet"></i>

<p>Start Earning</p>

</div>

</div>

<div class="form">

<div class="grid">

<div class="input">

<label>Full Name</label>

<input type="text" id="provFullName" placeholder="e.g. Chukwuma Obi" required>

</div>

<div class="input">

<label>Phone Number</label>

<input type="tel" id="provPhone" placeholder="e.g. 08012345678" required>

</div>

<div class="input">

<label>Email</label>

<input type="email" id="provEmail" placeholder="e.g. artisan@gmail.com" required>

</div>

<div class="input">

<label>Service Category</label>

<select id="provTrade">

<option value="Plumbing & Pipefitting">Plumbing & Pipefitting</option>
<option value="Electrical & Solar Specialist">Electrical & Solar Specialist</option>
<option value="AC & Refrigeration">AC & Refrigeration Tech</option>
<option value="Deep Cleaning & Fumigation">Deep Cleaning & Fumigation</option>
<option value="Generator Diagnostics">Generator Diagnostics & Overhaul</option>
<option value="Carpentry & Woodwork">Carpentry & Woodwork</option>
<option value="Wall Painting & Finishing">Wall Painting & Finishing</option>
<option value="Express Logistics Runner">Express Logistics Runner</option>

</select>

</div>

<div class="input">

<label>Years of Experience</label>

<input type="number" id="provExp" placeholder="e.g. 5" min="1">

</div>

<div class="input">

<label>Preferred City / Landmark</label>

<input type="text" id="provCity" placeholder="e.g. Shelter Afrique, Uyo">

</div>

</div>

<div class="input">

<label>Tell us about yourself</label>

<textarea id="provBio" placeholder="Describe your technical expertise and past commercial jobs..."></textarea>

</div>

<div class="upload">

<i class="fa-solid fa-cloud-arrow-up fa-3x"></i>

<h3 style="margin-top:15px;">

Upload NIN / Driver's License

</h3>

<p>

Identity verification required

</p>

</div>

<div class="upload">

<i class="fa-solid fa-camera fa-3x"></i>

<h3 style="margin-top:15px;">

Upload Profile Photo

</h3>

</div>

<button id="btnSubmitProv" onclick="submitApplication()">

Submit Application

</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="toast.js"></script>
<script src="swifterrand.js"></script>
<script>

async function submitApplication(){
  const name = document.getElementById('provFullName').value.trim() || "Verified Artisan";
  const phone = document.getElementById('provPhone').value.trim() || "08000000000";
  const email = document.getElementById('provEmail').value.trim() || `artisan.${Date.now()}@swifterrand.ng`;
  const trade = document.getElementById('provTrade').value;
  const location = document.getElementById('provCity').value.trim() || "Uyo / Lagos";
  const btn = document.getElementById('btnSubmitProv');

  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Submitting Application...';
  btn.disabled = true;

  // Insert into Supabase swift_providers directory
  if (window.SwiftSupabase && window.SwiftSupabase.init()) {
    try {
      const sb = window.SwiftSupabase.init();
      await sb.from('swift_providers').insert([{
        name: name,
        trade: trade,
        rating: 5.0,
        reviews_count: 1,
        jobs_count: 1,
        eta: '15-30 mins',
        location: location,
        landmark: location,
        badge: 'Verified Pro',
        is_available: true
      }]);
    } catch(err) {
      console.warn("Supabase provider registration notice:", err);
    }
  }

  // Update local session
  const provUser = {
    id: `PROV-${Math.floor(100 + Math.random() * 900)}`,
    name: name,
    email: email,
    phone: phone,
    role: 'provider',
    accountType: 'Agent',
    skill: trade,
    avatar: 'assets/images/provider1.jpg'
  };
  localStorage.setItem('swifterrand_user', JSON.stringify(provUser));
  if (window.SwiftErrand) window.SwiftErrand.setUser(provUser);

  if (typeof showToast === 'function') {
    showToast("Application Submitted Successfully. Welcome to the Guild!", "success");
  }

  setTimeout(()=>{
    window.location = "provider-dashboard.html";
  }, 1000);
}

</script>

</body>
</html>
