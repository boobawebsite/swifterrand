<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwiftErrand | In-App Direct Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Manrope',sans-serif;border-radius:0 !important;}
body{background:#f8fafc;color:#0f172a;height:100vh;display:flex;flex-direction:column;}
.navbar {
  position: sticky;
  top: 0;
  width: 100%;
  height: 74px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid #e2e8f0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6%;
  z-index: 1000;
  flex-shrink: 0;
  transition: all 0.3s ease;
}
.nav-content-default {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
}
.brand-icon {
  width: 40px;
  height: 40px;
  background: #00A651;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 19px;
  box-shadow: 0 4px 12px rgba(0, 166, 81, 0.25);
}
.brand-text {
  display: flex;
  flex-direction: column;
}
.brand-title {
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: #0f172a;
  line-height: 1.1;
}
.brand-sub {
  font-size: 11px;
  font-weight: 700;
  color: #64748b;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-top: 2px;
}
.nav-menu {
  display: flex;
  align-items: center;
  gap: 32px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.nav-link {
  font-size: 14px;
  font-weight: 600;
  color: #64748b;
  text-decoration: none;
  transition: color 0.2s;
  display: inline-flex;
  align-items: center;
}
.nav-link:hover, .nav-link.active {
  color: #00A651;
}
.nav-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 700;
  padding: 10px 20px;
  cursor: pointer;
  border: none;
  text-decoration: none;
  transition: all 0.2s ease;
}
.btn-ghost {
  background: transparent;
  color: #0f172a;
  border: 1px solid #cbd5e1;
}
.btn-ghost:hover {
  background: #f1f5f9;
  border-color: #94a3b8;
}
.btn-primary {
  background: #00A651;
  color: #fff;
  box-shadow: 0 4px 14px rgba(0, 166, 81, 0.25);
}
.btn-primary:hover {
  background: #008741;
  transform: translateY(-1px);
}
.menu-toggle {
  display: none;
  background: none;
  border: none;
  font-size: 22px;
  color: #0f172a;
  cursor: pointer;
}
.chat-container{flex:1;max-width:900px;width:100%;margin:20px auto;background:#fff;border-radius:0;box-shadow:0 10px 30px rgba(0,0,0,.04);border:1px solid #e2e8f0;display:flex;flex-direction:column;overflow:hidden;}
@media(max-width:1050px){.nav-menu{gap:18px;font-size:13px;}}
@media(max-width:900px){.nav-menu{display:none;}.menu-toggle{display:block;}}
.chat-header{padding:18px 25px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:15px;background:#f8fafc;}
.chat-header img{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid #00A651;}
.chat-body{flex:1;padding:25px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;background:#fafafa;}
.msg{max-width:70%;padding:14px 18px;border-radius:18px;font-size:14px;line-height:1.5;position:relative;}
.msg-provider{background:#fff;color:#0f172a;align-self:flex-start;border:1px solid #e2e8f0;border-bottom-left-radius:4px;}
.msg-customer{background:#00A651;color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
.msg-time{font-size:10px;margin-top:6px;opacity:.7;display:block;text-align:right;}
.chat-footer{padding:18px 25px;background:#fff;border-top:1px solid #f1f5f9;display:flex;gap:12px;align-items:center;}
.chat-footer input{flex:1;padding:14px 18px;border:2px solid #e2e8f0;border-radius:14px;font-size:15px;outline:none;}
.chat-footer input:focus{border-color:#00A651;}
.btn-send{padding:14px 22px;background:#00A651;color:#fff;border:none;border-radius:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;}
.btn-send:hover{background:#007A3D;}
</style>
</head>
<body>
<header class="navbar" id="navbar">
  <div class="nav-content-default" id="navDefault">
    <a href="index.html" class="brand">
      <div class="brand-icon"><i class="fa-solid fa-bolt"></i></div>
      <div class="brand-text">
        <span class="brand-title">SwiftErrand</span>
        <span class="brand-sub">Trusted Help. Fast.</span>
      </div>
    </a>

    <ul class="nav-menu">
      <li><a href="services.html" class="nav-link">Services</a></li>
      <li><a href="how-it-works.html" class="nav-link">How It Works</a></li>
      <li><a href="index.html#shield" class="nav-link">SwiftShield™</a></li>
      <li><a href="become-provider.html" class="nav-link">For Artisans</a></li>
      <li><a href="support.html" class="nav-link">Support Desk</a></li>
    </ul>

    <div class="nav-actions">
      <a href="login.html" class="btn btn-ghost" id="headerSignInBtn">Sign In</a>
      <a href="services.html" class="btn btn-primary">
        <i class="fa-solid fa-magnifying-glass"></i> Find Help
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation"><i class="fa-solid fa-bars"></i></button>
    </div>
  </div>
</header>

<div class="chat-container">
  <div class="chat-header">
    <img src="assets/images/provider1.jpg" alt="Provider">
    <div style="flex:1;">
      <h4 id="chatPartnerName" style="font-size:17px;">Verified Artisan</h4>
      <small id="chatPartnerSub" style="color:#00A651;font-weight:700;"><i class="fa-solid fa-circle" style="font-size:8px;"></i> Online • SwiftShield™ Secured</small>
    </div>
    <a href="tel:08000000000" id="chatCallBtn" style="padding:10px 16px;background:#f0fdf4;color:#00A651;border-radius:0;text-decoration:none;font-weight:700;font-size:13px;">
      <i class="fa-solid fa-phone"></i> Call
    </a>
  </div>

  <div class="chat-body" id="chatMessages">
    <!-- Messages loaded by JS -->
  </div>

  <div class="chat-footer">
    <button type="button" style="border:none;background:none;font-size:20px;color:#64748b;cursor:pointer;" onclick="showToast('Voice note recorded! Sent to technician.','success')"><i class="fa-solid fa-microphone"></i></button>
    <button type="button" style="border:none;background:none;font-size:20px;color:#64748b;cursor:pointer;" onclick="showToast('Photo uploaded from camera!','success')"><i class="fa-solid fa-camera"></i></button>
    <input type="text" id="chatInput" placeholder="Type instructions or message..." onkeypress="if(event.key==='Enter')sendMessage()">
    <button type="button" class="btn-send" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i> Send</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="toast.js"></script>
<script src="supabase-client.js"></script>
<script src="swifterrand.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const providerId = urlParams.get('provider') || "PROV-001";
const partnerName = urlParams.get('name') || "Verified Artisan";

document.getElementById('chatPartnerName').innerText = partnerName;

function renderChat() {
  const container = document.getElementById('chatMessages');
  const msgs = SwiftErrand.getChat(providerId);
  container.innerHTML = '';
  if (!msgs || msgs.length === 0) {
    container.innerHTML = `<div style="text-align:center;padding:40px 20px;color:#64748b;font-size:14px;"><i class="fa-solid fa-comments" style="font-size:32px;color:#cbd5e1;margin-bottom:10px;display:block;"></i> Direct, encrypted communication channel.<br>Type a message to begin.</div>`;
    return;
  }
  msgs.forEach(m => {
    const el = document.createElement('div');
    el.className = `msg msg-${m.sender}`;
    el.innerHTML = `
      ${m.text}
      <span class="msg-time">${m.time}</span>
    `;
    container.appendChild(el);
  });
  container.scrollTop = container.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById('chatInput');
  const txt = input.value.trim();
  if (!txt) return;

  input.value = '';
  SwiftErrand.sendChatMessage(providerId, txt, "customer");
  renderChat();
}

renderChat();
</script>
</body>
</html>
