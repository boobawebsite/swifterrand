<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwiftErrand | In-App Direct Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Manrope',sans-serif;}
body{background:#f8fafc;color:#0f172a;height:100vh;display:flex;flex-direction:column;}
nav{height:75px;display:flex;justify-content:space-between;align-items:center;padding:0 8%;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.05);flex-shrink:0;}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:22px;color:#0f172a;text-decoration:none;}
.logo-icon{width:40px;height:40px;background:#00A651;color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:10px;background:#f1f5f9;color:#0f172a;text-decoration:none;font-weight:600;}
.chat-container{flex:1;max-width:900px;width:100%;margin:20px auto;background:#fff;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.04);border:1px solid #e2e8f0;display:flex;flex-direction:column;overflow:hidden;}
.chat-header{padding:18px 25px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:15px;background:#f8fafc;}
.chat-header img{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid #00A651;}
.chat-body{flex:1;padding:25px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;background:#fafafa;}
.msg{max-width:70%;padding:14px 18px;border-radius:18px;font-size:14px;line-height:1.5;position:relative;}
.msg-provider{background:#fff;color:#0f172a;align-self:flex-start;border:1px solid #e2e8f0;border-bottom-left-radius:4px;}
.msg-customer{background:#00A651;color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
.msg-time{font-size:10px;margin-top:6px;opacity:.7;display:block;text-align:right;}
.chat-footer{padding:18px 25px;background:#fff;border-top:1px solid #f1f5f9;display:flex;gap:12px;align-items:center;}
.chat-footer input{flex:1;padding:14px 18px;border:2px solid #e2e8f0;border-radius:14px;font-size:15px;outline:none;}
.chat-footer input:focus{border-color:#00A651;}
.btn-send{padding:14px 22px;background:#00A651;color:#fff;border:none;border-radius:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;}
.btn-send:hover{background:#007A3D;}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">
    <div class="logo-icon"><i class="fa-solid fa-bolt"></i></div>
    <span>SwiftErrand Secure Messenger</span>
  </a>
  <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
</nav>

<div class="chat-container">
  <div class="chat-header">
    <img src="assets/images/provider1.jpg" alt="Provider">
    <div style="flex:1;">
      <h4 style="font-size:17px;">Emeka Okon</h4>
      <small style="color:#00A651;font-weight:700;"><i class="fa-solid fa-circle" style="font-size:8px;"></i> Online • Verified Master Plumber (Shelter Afrique)</small>
    </div>
    <a href="tel:08089876543" style="padding:10px 16px;background:#f0fdf4;color:#00A651;border-radius:10px;text-decoration:none;font-weight:700;font-size:13px;">
      <i class="fa-solid fa-phone"></i> Call
    </a>
  </div>

  <div class="chat-body" id="chatMessages">
    <!-- Messages loaded by JS -->
  </div>

  <div class="chat-footer">
    <button type="button" style="border:none;background:none;font-size:20px;color:#64748b;cursor:pointer;" onclick="showToast('Voice note recorded! Sent to technician.','success')"><i class="fa-solid fa-microphone"></i></button>
    <button type="button" style="border:none;background:none;font-size:20px;color:#64748b;cursor:pointer;" onclick="showToast('Photo uploaded from camera!','success')"><i class="fa-solid fa-camera"></i></button>
    <input type="text" id="chatInput" placeholder="Type instructions or message for Emeka..." onkeypress="if(event.key==='Enter')sendMessage()">
    <button type="button" class="btn-send" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i> Send</button>
  </div>
</div>

<script src="toast.js"></script>
<script src="swifterrand.js"></script>
<script>
const providerId = "PROV-201";

function renderChat() {
  const container = document.getElementById('chatMessages');
  const msgs = SwiftErrand.getChat(providerId);
  container.innerHTML = '';
  msgs.forEach(m => {
    const el = document.createElement('div');
    el.className = `msg msg-${m.sender}`;
    el.innerHTML = `
      ${m.text}
      <span class="msg-time">${m.time}</span>
    `;
    container.appendChild(el);
  });
  container.scrollTop = container.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById('chatInput');
  const txt = input.value.trim();
  if (!txt) return;

  input.value = '';
  SwiftErrand.sendChatMessage(providerId, txt, "customer", (reply) => {
    renderChat();
    showToast("New message from Emeka Okon!", "info");
  });
  renderChat();
}

renderChat();
</script>
</body>
</html>
